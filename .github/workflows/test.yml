name: Build & Lint
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.node-version'
        cache: npm
    - name: Install
      run: npm install
    - name: Build
      run: npm run build
    - name: Lint
      run: npm run lint
